name: Update GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update star and fork counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/update-stats.js

      - name: Regenerate sitemap.xml
        env:
          SITEMAP_UPDATE_LASTMOD: "false"
        run: bun scripts/generate-sitemap.js

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: updated-stats-and-sitemap
          path: |
            apps.json
            sitemap.xml
          if-no-files-found: error
